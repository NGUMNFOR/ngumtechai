
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Ngum Tech AI</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-header">
                <h1>Ngum Tech AI</h1>
                <h2>Forgot Password</h2>
                <p>Enter your email address to request a password reset.</p>
            </div>

            <form id="forgotPasswordForm">

                <div class="login-field">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div id="resetMessage" class="login-message"></div>

                <button type="submit" class="login-button">
                    Request Password Reset
                </button>

            </form>

            <div class="login-footer">
                <p>
                    <a href="login.html">Back to Sign In</a>
                </p>
            </div>

        </div>

    </main>
<script>
document.getElementById("forgotPasswordForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    try {
        const response = await fetch(
            "https://n8n.ngumtechai.com/webhook/admin-password-reset",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email: email })
            }
        );

        const data = await response.json();

if (data.success) {
    alert("Password reset request received successfully.");
} else {
    alert("Password reset request failed. Please try again.");
}

    } catch (error) {
        console.error("Password reset error:", error);
    }
});
</script>
</body>
</html>
