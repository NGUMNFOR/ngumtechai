
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Ngum Tech AI</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #ffffff;
    }

    h1 {
        margin-bottom: 8px;
    }

    h2 {
        margin-top: 30px;
        margin-bottom: 18px;
    }

    p {
        color: #cbd5e1;
    }

    form,
    table {
        width: 100%;
        max-width: 900px;
        background: #1e293b;
        padding: 24px;
        border-radius: 12px;
    }

    label {
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #475569;
        border-radius: 6px;
        background: #0f172a;
        color: #ffffff;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #1683ff;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #0b6edc;
    }

    table {
        border-collapse: collapse;
        margin-top: 10px;
    }

    th,
    td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #475569;
    }

    th {
        color: #93c5fd;
    }
</style>
</head>

<body>
    <script>
(function () {
    const isAuthenticated =
        sessionStorage.getItem("adminAuthenticated") === "true";

    const userRole =
        sessionStorage.getItem("userRole");

    if (!isAuthenticated || (userRole || "").trim().toLowerCase() !== "admin") {
        window.location.replace("login.html");
    }
})();
</script>

    <h1>Manage Users</h1>

    <p>Add and manage users who have access to the Admin Dashboard.</p>

    <h2>Add New User</h2>

    <form id="addUserForm">

        <label for="userName">Full Name</label><br>
        <input type="text" id="userName" required>

        <br><br>

        <label for="userEmail">Email Address</label><br>
        <input type="email" id="userEmail" required>

        <br><br>
        <label for="userPassword">Password</label><br>
<input type="password" id="userPassword" required>

<br><br>
        <label for="userRole">Role</label><br>
        <select id="userRole">
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
            <option value="staff">Staff</option>
        </select>

        <br><br>

        <button type="submit">Add User</button>

    </form>

    <h2>Current Users</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="usersTableBody">
        </tbody>
    </table>
 <script>
document.getElementById("addUserForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("userName").value.trim();
    const email = document.getElementById("userEmail").value.trim();
    const password = document.getElementById("userPassword").value;
    const role = document.getElementById("userRole").value;

    try {
        const response = await fetch(
            "https://n8n.ngumtechai.com/webhook/admin-add-user",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    role: role
                })
            }
        );

        if (!response.ok) {
            throw new Error("Request failed");
        }

        alert("User sent successfully!");

    } catch (error) {
        console.error(error);
        alert("Unable to add user.");
    }
});
</script>
<script>
async function loadUsers() {
    const tableBody = document.getElementById("usersTableBody");

    tableBody.innerHTML = '<tr><td colspan="5">Loading users...</td></tr>';

    try {
        const sessionToken = sessionStorage.getItem("sessionToken");

const response = await fetch(
    "https://n8n.ngumtechai.com/webhook/get-users",
    {
        method: "GET",
        headers: {
            "X-Session-Token": sessionToken
        }
    }
);

        if (!response.ok) {
            throw new Error("Failed to load users");
        }

        const users = await response.json();

        tableBody.innerHTML = "";

        users.forEach(user => {
            const row = document.createElement("tr");

            [user.name, user.email, user.role].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            const statusCell = document.createElement("td");
            statusCell.textContent =
                user.active === true ? "Active" : "Inactive";
            row.appendChild(statusCell);

            const actionCell = document.createElement("td");

const viewButton = document.createElement("button");
viewButton.textContent = "View";
viewButton.type = "button";

viewButton.style.background = "#2563eb";
viewButton.style.color = "white";
viewButton.style.border = "none";
viewButton.style.padding = "6px 14px";
viewButton.style.borderRadius = "5px";
viewButton.style.cursor = "pointer";

viewButton.addEventListener("click", function () {

    const name = user.name || "N/A";
    const email = user.email || "N/A";
    const role = user.role || "N/A";
    const status = user.active === true ? "Active" : "Inactive";

    alert(
        "USER DETAILS\n\n" +
        "Full Name: " + name + "\n" +
        "Email: " + email + "\n" +
        "Role: " + role + "\n" +
        "Status: " + status
    );

});

actionCell.appendChild(viewButton);

const editButton = document.createElement("button");
editButton.textContent = "Edit";
editButton.type = "button";

editButton.style.background = "#16a34a";
editButton.style.color = "white";
editButton.style.border = "none";
editButton.style.padding = "6px 14px";
editButton.style.borderRadius = "5px";
editButton.style.cursor = "pointer";
editButton.style.marginLeft = "8px";

editButton.addEventListener("click", async function () {
    const newName = prompt("Edit name:", user.name || "");
    if (newName === null) return;

    const newRole = prompt("Edit role:", user.role || "");
    if (newRole === null) return;

    const newActive = confirm(
        "Should this user remain Active?\n\nOK = Active\nCancel = Inactive"
    );

    const sessionToken = sessionStorage.getItem("sessionToken");

    try {
        const response = await fetch(
            "https://n8n.ngumtechai.com/webhook/admin-edit-user",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Session-Token": sessionToken
                },
                body: JSON.stringify({
                    email: user.email,
                    name: newName.trim(),
                    role: newRole.trim(),
                    active: newActive
                })
            }
        );

        const result = await response.json();

        if (!response.ok || result.success !== true) {
            throw new Error(result.message || "Unable to update user.");
        }

        alert("User updated successfully.");
        await loadUsers();

    } catch (error) {
        console.error("Error updating user:", error);
        alert("Unable to update user.");
    }
});
actionCell.appendChild(editButton);
row.appendChild(actionCell);

            tableBody.appendChild(row);
        });

    } catch (error) {
        console.error("Error loading users:", error);
        tableBody.innerHTML =
            '<tr><td colspan="5">Unable to load users</td></tr>';
    }
}

document.addEventListener("DOMContentLoaded", loadUsers);
</script>
</body>
</html>
