
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Ngum Tech AI</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #ffffff;
    }

    h1 {
        margin-bottom: 8px;
    }

    h2 {
        margin-top: 30px;
        margin-bottom: 18px;
    }

    p {
        color: #cbd5e1;
    }

    form,
    table {
        width: 100%;
        max-width: 900px;
        background: #1e293b;
        padding: 24px;
        border-radius: 12px;
    }

    label {
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #475569;
        border-radius: 6px;
        background: #0f172a;
        color: #ffffff;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #1683ff;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #0b6edc;
    }

    table {
        border-collapse: collapse;
        margin-top: 10px;
    }

    th,
    td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #475569;
    }

    th {
        color: #93c5fd;
    }
</style>
</head>

<body>

    <h1>Manage Users</h1>

    <p>Add and manage users who have access to the Admin Dashboard.</p>

    <h2>Add New User</h2>

    <form id="addUserForm">

        <label for="userName">Full Name</label><br>
        <input type="text" id="userName" required>

        <br><br>

        <label for="userEmail">Email Address</label><br>
        <input type="email" id="userEmail" required>

        <br><br>
        <label for="userPassword">Password</label><br>
<input type="password" id="userPassword" required>

<br><br>
        <label for="userRole">Role</label><br>
        <select id="userRole">
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
            <option value="staff">Staff</option>
        </select>

        <br><br>

        <button type="submit">Add User</button>

    </form>

    <h2>Current Users</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="usersTableBody">
        </tbody>
    </table>
 <script>
document.getElementById("addUserForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("userName").value.trim();
    const email = document.getElementById("userEmail").value.trim();
    const password = document.getElementById("userPassword").value;
    const role = document.getElementById("userRole").value;

    try {
        const response = await fetch(
            "https://n8n.ngumtechai.com/webhook/admin-add-user",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    role: role
                })
            }
        );

        if (!response.ok) {
            throw new Error("Request failed");
        }

        alert("User sent successfully!");

    } catch (error) {
        console.error(error);
        alert("Unable to add user.");
    }
});
</script>

</body>
</html>
