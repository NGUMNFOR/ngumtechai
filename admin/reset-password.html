
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Ngum Tech AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .reset-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="reset-container">

    <h2>Ngum Tech AI</h2>

    <p class="subtitle">Create a New Password</p>

    <form id="resetForm">

        <label for="password">New Password</label>
        <input
            type="password"
            id="password"
            required
            minlength="8"
            placeholder="Enter new password"
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
            type="password"
            id="confirmPassword"
            required
            minlength="8"
            placeholder="Confirm new password"
        >

        <button type="submit">Reset Password</button>

    </form>

    <p id="message"></p>

    <a href="login.html" class="back-login">Back to Sign In</a>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    if (!token) {
        message.textContent = "Invalid or missing password reset token.";
        message.style.color = "red";
        form.style.display = "none";
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            message.style.color = "red";
            return;
        }

        message.textContent = "Processing...";
        message.style.color = "#555";

        try {
    const response = await fetch(
        "https://n8n.ngumtechai.com/webhook/admin-password-update",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                token: token,
                password: password
            })
        }
    );

    const data = await response.json();

    if (response.ok && data.success) {
        message.textContent = "Password reset successfully.";
        message.style.color = "green";
    } else {
        message.textContent = data.message || "Unable to reset password.";
        message.style.color = "red";
    }

} catch (error) {
    console.error(error);
    message.textContent = "Unable to connect. Please try again.";
    message.style.color = "red";
}
    });
</script>

</body>
</html>
